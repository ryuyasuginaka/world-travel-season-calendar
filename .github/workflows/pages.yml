name: Validate & Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check JavaScript
        run: |
          for f in js/*.js; do
            echo "checking $f"
            node --check "$f"
          done
      - name: Validate Cloudflare public build
        run: |
          node --test scripts/build-cloudflare.test.mjs
          node scripts/build-cloudflare.mjs --base-url https://season-atlas.ryuya-suginaka.workers.dev/

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage public site files only
        run: |
          mkdir -p _site
          cp index.html home.html robots.txt sitemap.xml _site/
          cp -R css js assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
